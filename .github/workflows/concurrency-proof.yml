name: concurrency proof
# Scratch-only proof for PushNotice purge-cache.yml: the exact job-level concurrency group.
on:
  deployment_status:
  workflow_dispatch:
permissions: {}
jobs:
  hold:
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: purge-cloudflare-production-${{ github.event_name }}-${{ github.event.deployment_status.id || github.run_id }}
      cancel-in-progress: true
    steps:
      - run: |
          echo "deployment=${{ github.event.deployment.id }} status=${{ github.event.deployment_status.id }} group=purge-cloudflare-production-${{ github.event_name }}-${{ github.event.deployment_status.id || github.run_id }}"
          sleep 90
