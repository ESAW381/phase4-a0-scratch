name: Skip probe (push)

# Observation 9 scratch proof: does a push to main start this workflow? It prints the pushed
# commits' IDs and first message lines from the event payload (data only, never interpolated).
on:
  push:
    branches: [main]

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Show the push
        run: |
          jq -r '"head_commit=" + .head_commit.id, "head_first_line=" + (.head_commit.message | split("\n")[0]), (.commits[] | "commit=" + .id + " first_line=" + (.message | split("\n")[0]))' "$GITHUB_EVENT_PATH"
